name: Deploy Sedrava website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sedrava-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies and build
        run: |
          npm install
          npm run lint:content
          npm run build

      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Verify generated site pages
        run: |
          test -s dist/index.html
          test -s dist/ru/index.html
          test -s dist/text-010/index.html
          test -s dist/ru/text-010/index.html

      - name: Upload site files over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          PORT="${SSH_PORT:-22}"
          TARGET="/var/www/virtreal_ru_usr27/data/www/virtreal.ru/sedrava"
          SSH_OPTS=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -p "$PORT")

          # FASTPANEL hosts may not have rsync. Use standard tar over SSH instead.
          ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" \
            "test -d '$TARGET' && test -w '$TARGET' && command -v tar >/dev/null"

          tar -C dist -cf - . | ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" \
            "tar -C '$TARGET' -xf -"

          echo "Uploaded static site to $TARGET (existing unrelated files preserved)."
