name: Deploy Sedrava website

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sedrava-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies and build
        run: |
          npm install
          npm run build

      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Upload site files
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -eu
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          PORT="${SSH_PORT:-22}"
          rsync -az --no-owner --no-group \
            -e "ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p $PORT" \
            dist/ "$SSH_USER@$SSH_HOST:/var/www/virtreal_ru_usr27/data/www/virtreal.ru/sedrava/"
