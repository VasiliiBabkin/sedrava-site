name: Build Sedrava dev website
run-name: Native Sedrava staging / ${{ inputs.publish && 'PUBLISH DEV' || 'PREPARE ONLY' }} / ${{ github.ref_name }}

# Already registered on main. Select the native feature branch in Run workflow.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'I approve publishing the verified native site to dev.virtreal.ru only (backed up and verified)'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  choose-accepted-preview:
    if: ${{ github.ref == 'refs/heads/feature/sedrava-native-docs-live-examples' }}
    runs-on: ubuntu-24.04
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - name: Identify a successful three-engine native preview at the exact chosen commit
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/preview-sedrava-native.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=60" > successful-previews.json
          python3 - <<'PY'
          import json, os
          runs = json.load(open('successful-previews.json'))['workflow_runs']
          candidates = [run for run in runs
                        if run['head_sha'] == os.environ['GITHUB_SHA']
                        and run['conclusion'] == 'success'
                        and run['status'] == 'completed'
                        and run['path'] == '.github/workflows/preview-sedrava-native.yml'
                        and run.get('head_repository', {}).get('full_name') == os.environ['GITHUB_REPOSITORY']]
          if not candidates:
              raise SystemExit('No fully successful native preview for this exact commit. Review PR #10 CI before dispatch.')
          selected = max(candidates, key=lambda run: int(run['id']))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as handle:
              handle.write(f"run_id={selected['id']}\n")
          print(f"Accepted native preview run: {selected['id']}, exact SHA {selected['head_sha']}")
          PY
  native-staging:
    needs: choose-accepted-preview
    uses: ./.github/workflows/stage-sedrava-native.yml
    with:
      run_id: ${{ needs.choose-accepted-preview.outputs.run_id }}
      publish: ${{ inputs.publish }}
      confirm_domain: ${{ inputs.publish && 'dev.virtreal.ru' || '' }}
    secrets: inherit
