name: Build Sedrava dev website
on:
  push:
    branches: [feature/sedrava-dev-preview]
    paths:
      - 'sedrava-dev/**'
      - '.github/workflows/deploy-sedrava-dev.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Upload to dev.virtreal.ru after successful build'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: sedrava-dev-preview
  cancel-in-progress: false
jobs:
  dev-site:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Check out website sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check out experimental Sedrava compiler
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: VasiliiBabkin/sedrava
          ref: b54e19b5f9b7b23dff24cc4c8ff45a833a8fe0a7
          path: .sedrava-compiler
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build .sdr website
        env:
          PYTHONPATH: .sedrava-compiler
        run: |
          python -m sedrava_cli build site sedrava-dev/site.sdr --output build/sedrava-dev
          test -s build/sedrava-dev/index.html
          test -s build/sedrava-dev/site.css
          test -s build/sedrava-dev/sedrava-site.json
      - name: Upload preview artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sedrava-dev-preview
          path: build/sedrava-dev/
          if-no-files-found: error
      - name: Configure SSH
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        env:
          DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Publish only to dev.virtreal.ru
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          PORT="${SSH_PORT:-22}"
          TARGET="/var/www/virtreal_ru_usr27/data/www/virtreal.ru/dev"
          SSH_OPTS=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -p "$PORT")
          ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" "test -d '$TARGET' && test -w '$TARGET' && command -v tar >/dev/null"
          tar -C build/sedrava-dev -cf - . | ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" "tar -C '$TARGET' -xf -"
          ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" "test -s '$TARGET/index.html' && test -s '$TARGET/site.css'"
