name: Build site

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run lint:content
      - run: npm run build
      - name: Verify bilingual documentation pages
        run: |
          test -s dist/index.html
          test -s dist/ru/index.html
          test -s dist/text-010/index.html
          test -s dist/ru/text-010/index.html
