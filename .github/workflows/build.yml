name: Build site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm install
      - run: npm run lint:content
      - run: npm run build
      - name: Verify bilingual documentation pages
        run: |
          test -s dist/index.html
          test -s dist/ru/index.html
          test -s dist/text-010/index.html
          test -s dist/ru/text-010/index.html
          test -s dist/releases/index.html
          test -s dist/ru/releases/index.html
          for page in getting-started examples language-overview roadmap text-010; do
            test -s "dist/$page/index.html"
            test -s "dist/ru/$page/index.html"
          done
      - name: Check branding in Chromium
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
          python scripts/check-branding.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sedrava-site-branding-preview
          path: |
            dist/
            build/branding-check/
